<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1c130e"><title>Cóndores de Colombia</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at top,#523621,#160f0b 75%);color:#f6e8d4;font-family:Georgia,serif;display:flex;align-items:center;justify-content:center}main{width:min(95vw,800px);text-align:center;padding:22px 0}h1{font-size:clamp(22px,4vw,38px);font-weight:400;letter-spacing:.09em;margin:0 0 16px}img{width:100%;height:auto;display:block;border:5px solid #a67c48;box-shadow:0 12px 50px #0009}button{margin:18px auto 8px;border:1px solid #d6ae72;border-radius:40px;background:#f0d6a7;color:#24170d;font-size:17px;font-weight:600;padding:13px 25px;cursor:pointer}p{font-family:system-ui,sans-serif;color:#d8c5a7;font-size:13px;margin:6px 0 0}</style></head><body><main><h1>CÓNDORES DE COLOMBIA</h1><img src="collage.png" alt="Collage Cóndores de Colombia"><button id="play" type="button">♫ Reproducir música</button><p id="status" aria-live="polite">Sangre Caliente</p><audio id="music" src="Sangre%20Caliente.mp3" preload="auto" autoplay loop playsinline></audio></main><script>const audio=document.getElementById('music'),button=document.getElementById('play'),status=document.getElementById('status');audio.volume=.85;function sync(){button.textContent=audio.paused?'♫ Reproducir música':'Ⅱ Pausar música';status.textContent=audio.paused?'Toca para escuchar Sangre Caliente':'Reproduciendo Sangre Caliente'}async function start(){try{await audio.play()}catch(e){status.textContent='Toca el botón para activar el sonido'}sync()}button.addEventListener('click',async()=>{if(audio.paused){await start()}else{audio.pause();sync()}});audio.addEventListener('play',sync);audio.addEventListener('pause',sync);window.addEventListener('load',start);document.addEventListener('visibilitychange',()=>{if(!document.hidden && audio.paused && !audio.dataset.userPaused)start()});</script></body></html>
